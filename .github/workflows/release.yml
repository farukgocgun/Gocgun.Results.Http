name: release

# Standalone repo release for Gocgun.Results.Http (nuget.org Trusted Publishing policy: workflow file `release.yml`, environment `nuget`).
# Manual only. Publishing runs only when `publish` is ticked and the `nuget` environment allows it. No API key secret is stored.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Push the packed .nupkg and .snupkg files to nuget.org after tests pass
        required: true
        type: boolean
        default: false

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
  DOTNET_SDK_BAND: "10.0.1xx"

jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
        with:
          dotnet-version: ${{ env.DOTNET_SDK_BAND }}
      - name: Test
        run: |
          set -euo pipefail
          mapfile -t tests < <(find tests -name '*.Tests.csproj' | sort -u)
          if [[ ${#tests[@]} -eq 0 ]]; then echo "no test project under tests" >&2; exit 1; fi
          for project in "${tests[@]}"; do dotnet test --project "$project"; done
      - name: Pack
        run: |
          set -euo pipefail
          dotnet pack src/Gocgun.Results.Http/Gocgun.Results.Http.csproj --configuration Release --output "$RUNNER_TEMP/packages"
          ls -l "$RUNNER_TEMP/packages"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: inputs.publish
        with:
          name: packages
          path: ${{ runner.temp }}/packages
          if-no-files-found: error

  publish:
    if: inputs.publish
    needs: pack
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: nuget
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: packages
          path: packages
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
        with:
          dotnet-version: ${{ env.DOTNET_SDK_BAND }}
      - name: Log in to nuget.org (short-lived API key from OIDC token)
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Push to nuget.org
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          dotnet nuget push "packages/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
